name: invoice_genreator
description: "BillBook — Professional Invoice Generator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  uuid: ^4.4.0
  intl: ^0.20.2
  pdf: ^3.11.1
  printing: ^5.13.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  open_filex: ^4.3.4
  share_plus: ^10.0.3
  url_launcher: ^6.3.1
  flutter_slidable: ^3.1.1
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  google_sign_in_web: ^0.12.4
  google_sign_in_platform_interface: ^2.4.0
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.2
  image_picker: ^1.1.2
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2
  flutter_email_sender: ^8.0.0
  crypto: ^3.0.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  file_picker: ^8.1.7
  csv: ^6.0.0
  google_mobile_ads:
    path: packages/google_mobile_ads
  in_app_purchase: ^3.2.1
  in_app_review: ^2.0.9
  firebase_core: ^3.7.0
  cloud_firestore: ^5.3.0
  qr_flutter: ^4.1.0
  flutter_zxing: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/billbook_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/billbook_icon_fg.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/
    - assets/fonts/
