<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BillBook — Professional Invoice Generator for businesses, freelancers and consultants. Create GST-compliant invoices, manage clients, track payments.">
  <meta name="theme-color" content="#2563EB">

  <!-- Google Sign-In Web Client ID — REPLACE with your Web application client ID from
       Google Cloud Console → APIs & Services → Credentials → OAuth 2.0 Client IDs (type: Web application).
       Project: invoicegenerator-497122 -->
  <meta name="google-signin-client_id" content="891634878125-hh0jrdebvo205mclifdpau6tbo66a9cu.apps.googleusercontent.com">

  <!-- Open Graph -->
  <meta property="og:title" content="BillBook — Invoice Generator">
  <meta property="og:description" content="Professional invoicing for modern businesses. GST-compliant, multi-template, cloud-synced.">
  <meta property="og:type" content="website">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BillBook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BillBook — Invoice Generator</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #F1F5F9; z-index: 9999;
    }
    #loading .logo {
      width: 56px; height: 56px; background: #2563EB; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px; box-shadow: 0 8px 24px rgba(37,99,235,0.3);
    }
    #loading .logo span { color: white; font-size: 22px; font-weight: 800; letter-spacing: -1px; }
    #loading h1 { color: #0F172A; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    #loading p { color: #64748B; font-size: 13px; margin-bottom: 32px; }
    #loading .spinner {
      width: 32px; height: 32px; border: 3px solid #E2E8F0;
      border-top-color: #2563EB; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo"><span>BB</span></div>
    <h1>BillBook</h1>
    <p>Invoice Generator</p>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(function(){ el.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
